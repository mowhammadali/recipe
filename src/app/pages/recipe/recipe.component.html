<div class="recipe">
    @if (isLoading()) {
        <div class="skeleton-container">
            <app-skeleton width="100%" height="10rem"></app-skeleton>
            <app-skeleton width="50%" height="1.5rem"></app-skeleton>
        </div>
    } @else {
        <div class="cover-container">
            <img [src]="recipe().image" />
            <div class="back-contaienr" [routerLink]="['../']">
                <app-icon
                    color="var(--color-surface-1)"
                    icon="mingcute:arrow-left-circle-fill"
                ></app-icon>
            </div>
            <div class="bookmark-contaienr">
                <app-icon color="var(--color-surface-1)" icon="mingcute:bookmark-line"></app-icon>
            </div>
            <app-info-box [recipe]="recipe()"></app-info-box>
        </div>
        <div class="content">
            <app-ingredients [ingredients]="recipe().ingredients"></app-ingredients>
        </div>
    }
</div>
